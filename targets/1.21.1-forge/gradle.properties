# Typing Animation - Forge target 1.21.1-forge. Versions follow the official Forge MDK forge-1.21.1-52.1.16-mdk.zip (ForgeGradle 7);
# the mod metadata comes from scripts/target-common.gradle and target.properties.
# Always build with --no-daemon (docs/SPEC.md section 3); keep the Gradle heap <= 3G.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

# Minecraft and Forge used to compile and run in dev
minecraft_version=1.21.1
forge_version=52.1.16
# Lowest Forge (= javafml loader version) accepted at runtime: Forge 51.x = MC 1.21, 52.x = MC 1.21.1.
forge_version_range=[51,)
