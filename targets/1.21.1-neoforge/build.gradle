// Typing Animation - NeoForge target 1.21.1-neoforge (docs/SPEC.md). Derived from the official NeoForge MDK
// (github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle), example content removed. Client-only mod; the mixin config is
// registered by [[mixins]] in neoforge.mods.toml (no refmap: NeoForge runs with Mojang names).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

// Shared target setup: target.properties, mod metadata, source dirs, release jar name, toolchain, LICENSE.
apply from: '../../scripts/target-common.gradle'

neoForge {
    version = project.neo_version

    // Parchment only adds parameter names/javadoc; class, method and field names stay official Mojang names.
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            // The dev client inherits the Gradle environment (TYPINGANIMATION_SELFTEST=1, docs/SPEC.md section 9).
            client()
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "typinganimation" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expands src/main/templates (META-INF/neoforge.mods.toml) like the MDK: shared metadata
// (scripts/target-common.gradle) + this target's NeoForge floor.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = typing.expand + [neo_version_range: project.neo_version_range]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
