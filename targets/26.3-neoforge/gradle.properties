# Typing Animation - NeoForge target 26.3-neoforge. Versions follow the official NeoForge MDK (MDK-26.3-ModDevGradle); the mod
# metadata comes from scripts/target-common.gradle and target.properties.
# Always build with --no-daemon (docs/SPEC.md section 3); keep the Gradle heap <= 3G.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# NeoForge used to compile and run in dev
neo_version=26.3.0.34-beta
# Lowest NeoForge accepted at runtime: every NeoForge build for MC 26.3 (26.3.0.x, betas so far).
neo_version_range=[26.3.0-beta,)
