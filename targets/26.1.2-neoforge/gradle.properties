# Typing Animation - NeoForge target 26.1.2-neoforge. Versions follow the official NeoForge MDK (MDK-26.1.2-ModDevGradle); the mod
# metadata comes from scripts/target-common.gradle and target.properties.
# Always build with --no-daemon (docs/SPEC.md section 3); keep the Gradle heap <= 3G.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# NeoForge used to compile and run in dev
neo_version=26.1.2.112
# Lowest NeoForge accepted at runtime: the first NeoForge line for MC 26.1 (26.1.0.x).
neo_version_range=[26.1.0-beta,)
