# Typing Animation - Fabric target 26.1.2-fabric. Versions follow the official fabric-example-mod (branch 26.1.2); the mod
# metadata comes from scripts/target-common.gradle and target.properties.
# Always build with --no-daemon (docs/SPEC.md section 3); keep the Gradle heap <= 3G.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric (https://fabricmc.net/develop). Loom 1.18 needs a Java 25 Gradle JVM (target.properties gradle.jdk=25);
# the mod is compiled and run on the java.release toolchain from target.properties.
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.18.2

# Lowest Fabric Loader accepted at runtime: the stable loader that Fabric's announcement of this Minecraft line
# told players to install ("Fabric for Minecraft 26.1", 2026-03-14).
fabricloader_dependency=>=0.18.4

# Optional Mod Menu integration (compile only, maven.terraformersmc.com): 18.x supports MC 26.1 - 26.1.2
modmenu_version=18.0.2
