// Typing Animation - Forge target 1.20.1-forge (docs/SPEC.md). Derived from the official Forge MDK
// forge-1.20.1-47.4.23-mdk.zip (ForgeGradle 6), example content removed. Client-only mod.
// One jar for Forge 46.x (MC 1.20), Forge 47.x (MC 1.20.1) and NeoForge 47.1.x (MC 1.20.1).
plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    // Forge 1.20.x runs with SRG names in production -> the mixins need a refmap, generated by MixinGradle.
    id 'org.spongepowered.mixin' version '0.7.38'
}

// Shared target setup: target.properties, mod metadata, source dirs, release jar name, toolchain, LICENSE.
apply from: '../../scripts/target-common.gradle'

minecraft {
    // Official Mojang mappings
    mappings channel: 'official', version: minecraft_version

    // REQUIRED for this template to function (process resources into IDE output dirs before launching).
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'

            mods {
                "typinganimation" {
                    source sourceSets.main
                }
            }
        }

        // Client-only mod: only a client run configuration. The dev client inherits the Gradle environment
        // (TYPINGANIMATION_SELFTEST=1, docs/SPEC.md section 9).
        client {
        }
    }
}

// Mixins on Forge 1.20.x: Mixin 0.8.5 is bundled (MixinExtras is NOT bundled by Forge 46/47 nor NeoForge 47.1, so
// the shared mixins use plain Mixin only). The annotation processor writes an SRG refmap that reobfJar ships; dev
// runs get --mixin.config plus the refmap remapping properties from MixinGradle.
mixin {
    add sourceSets.main, 'typinganimation.refmap.json'
    config 'typinganimation.mixins.json'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// mods.toml / pack.mcmeta: shared metadata (scripts/target-common.gradle) + this target's Forge range.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = typing.expand + [forge_version_range: forge_version_range]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
    // The shared mixin config has no refmap key (Loom remaps Fabric's mixins itself, NeoForge/Forge 1.20.5+ run
    // Mojang names): point this loader's copy at the refmap MixinGradle generates (docs/SPEC.md section 2).
    filesMatching('typinganimation.mixins.json') {
        filter { String line ->
            line.contains('"package"') ? '  "refmap": "typinganimation.refmap.json",\n' + line : line
        }
    }
}

tasks.named('jar', Jar).configure {
    // How FML 46/47 (and NeoForge 47.1) discover mixin configs: Mixin's ModLauncher service reads this manifest
    // attribute (mods.toml has no [[mixins]] support before NeoForge 20.2).
    manifest.attributes('MixinConfigs': 'typinganimation.mixins.json')
    // Reobfuscate to SRG names (the 1.20.x Forge runtime namespace); reobfJar rewrites the jar in place.
    finalizedBy 'reobfJar'
}
