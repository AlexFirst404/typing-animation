pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        // MixinGradle (refmap generation for the SRG runtime names of Forge 1.20.x) lives on the Sponge maven.
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    // Lets Gradle provision the Java toolchain (target.properties java.release) when it is not installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'typinganimation-1.20.1-forge'
