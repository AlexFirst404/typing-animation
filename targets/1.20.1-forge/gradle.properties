# Typing Animation - Forge target 1.20.1-forge. Versions follow the official Forge MDK forge-1.20.1-47.4.23-mdk.zip
# (ForgeGradle 6, Gradle 8.8); the mod metadata comes from scripts/target-common.gradle and target.properties.
# Always build with --no-daemon (docs/SPEC.md section 3); keep the Gradle heap <= 3G (the Minecraft setup needs it).
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft and Forge used to compile and run in dev. The declared range 1.20 - 1.20.1 is safe: the Mojang-named
# client API, line tables and SRG ids of every class we touch are identical between 1.20 and 1.20.1.
minecraft_version=1.20.1
forge_version=47.4.23
# Lowest Forge (= javafml loader version) accepted at runtime: Forge 46.x = MC 1.20, Forge 47.x = MC 1.20.1; NeoForge
# for 1.20.1 still reports modId "forge" with 47.1.x.
forge_version_range=[46,)
