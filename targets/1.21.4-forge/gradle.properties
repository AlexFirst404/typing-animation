# Typing Animation - Forge target 1.21.4-forge. Versions follow the official Forge MDK forge-1.21.4-54.1.18-mdk.zip (ForgeGradle 7);
# the mod metadata comes from scripts/target-common.gradle and target.properties.
# Always build with --no-daemon (docs/SPEC.md section 3); keep the Gradle heap <= 3G.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

# Minecraft and Forge used to compile and run in dev
minecraft_version=1.21.4
forge_version=54.1.18
# Lowest Forge (= javafml loader version) accepted at runtime: every Forge build for MC 1.21.4 (54.x).
forge_version_range=[54,)
