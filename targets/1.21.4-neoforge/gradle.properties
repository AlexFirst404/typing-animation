# Typing Animation - NeoForge target 1.21.4-neoforge. Versions follow the official NeoForge MDK (MDK-1.21.4-ModDevGradle); the mod
# metadata comes from scripts/target-common.gradle and target.properties.
# Always build with --no-daemon (docs/SPEC.md section 3); keep the Gradle heap <= 3G.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment (parameter names only)
parchment_minecraft_version=1.21.4
parchment_mappings_version=2025.03.23

# NeoForge used to compile and run in dev
neo_version=21.4.158
# Lowest NeoForge accepted at runtime: every NeoForge build for MC 1.21.4 (21.4.x).
neo_version_range=[21.4.0-beta,)
