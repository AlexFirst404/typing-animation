# Typing Animation - Forge target 26.1.2-forge. Versions follow the official Forge MDK forge-26.1.2-64.1.3-mdk.zip (ForgeGradle 7);
# the mod metadata comes from scripts/target-common.gradle and target.properties.
# Always build with --no-daemon (docs/SPEC.md section 3); keep the Gradle heap <= 3G.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

# Minecraft and Forge used to compile and run in dev
minecraft_version=26.1.2
forge_version=64.1.3
# Lowest Forge (= javafml loader version) accepted at runtime: Forge 62.x = MC 26.1, 63.x = 26.1.1, 64.x = 26.1.2.
forge_version_range=[62,)
