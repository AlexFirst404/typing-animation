# Typing Animation - Forge target 1.21.10-forge. Versions follow the official Forge MDK forge-1.21.10-60.1.15-mdk.zip (ForgeGradle 7);
# the mod metadata comes from scripts/target-common.gradle and target.properties.
# Always build with --no-daemon (docs/SPEC.md section 3); keep the Gradle heap <= 3G.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

# Minecraft and Forge used to compile and run in dev
minecraft_version=1.21.10
forge_version=60.1.15
# Lowest Forge (= javafml loader version) accepted at runtime: Forge 59.x = MC 1.21.9, 60.x = MC 1.21.10.
# (Forge 59.x does not bundle MixinExtras; the shared mixins use plain Mixin only, so the whole range is kept.)
forge_version_range=[59,)
