# Typing Animation - Fabric target 1.21.11-fabric. Versions follow the official fabric-example-mod (branch 1.21.11); the mod
# metadata comes from scripts/target-common.gradle and target.properties.
# Always build with --no-daemon (docs/SPEC.md section 3); keep the Gradle heap <= 3G.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric (https://fabricmc.net/develop). Loom 1.18 needs a Java 25 Gradle JVM (target.properties gradle.jdk=25);
# the mod is compiled and run on the java.release toolchain from target.properties.
minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.18.2

# Lowest Fabric Loader accepted at runtime: the stable loader that Fabric's announcement of this Minecraft line
# told players to install ("Fabric for Minecraft 1.21.11", 2025-12-05).
fabricloader_dependency=>=0.18.1

# Optional Mod Menu integration (compile only, maven.terraformersmc.com): 17.x is the release for MC 1.21.11
modmenu_version=17.0.1
