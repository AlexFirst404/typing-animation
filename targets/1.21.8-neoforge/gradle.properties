# Typing Animation - NeoForge target 1.21.8-neoforge. Versions follow the official NeoForge MDK (MDK-1.21.8-ModDevGradle); the mod
# metadata comes from scripts/target-common.gradle and target.properties.
# Always build with --no-daemon (docs/SPEC.md section 3); keep the Gradle heap <= 3G.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment (parameter names only)
parchment_minecraft_version=1.21.8
parchment_mappings_version=2025.09.14

# NeoForge used to compile and run in dev
neo_version=21.8.54
# Lowest NeoForge accepted at runtime: the first NeoForge line for MC 1.21.6 (21.6.x).
neo_version_range=[21.6.0-beta,)
